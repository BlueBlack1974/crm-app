<!DOCTYPE html>
<html lang="{{ session.get('language', 'tr') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}Crandyx CRM{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Font Awesome -->
    <link href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding: 20px; }
        body.dark-mode { background-color: #212529 !important; color: #f8f9fa !important; }
        body.dark-mode .card, body.dark-mode .bg-light { background-color: #2c3034 !important; border-color: #495057 !important; color: #f8f9fa !important; }
        body.dark-mode .table { color: #f8f9fa !important; border-color: #495057 !important; }
        body.dark-mode .table th, body.dark-mode .table td { background-color: #2c3034 !important; border-color: #495057 !important; color: #f8f9fa !important; }
        body.dark-mode .table-light { background-color: #343a40 !important; color: #f8f9fa !important; }
        body.dark-mode .text-muted { color: #adb5bd !important; }
        body.dark-mode .form-control, body.dark-mode .form-select { background-color: #343a40 !important; border-color: #495057 !important; color: #f8f9fa !important; }
        body.dark-mode .form-control:focus, body.dark-mode .form-select:focus { background-color: #3a4148 !important; color: #f8f9fa !important; }
        body.dark-mode .alert-info { background-color: #0c5460; color: #d1ecf1; border-color: #117a8b; }
        body.dark-mode .upload-zone { border-color: #0d6efd; background-color: #2c3034; }
        body.dark-mode .upload-zone:hover { background-color: #343a40; }
        body.dark-mode .progress-steps .step-number { background-color: #495057; color: #adb5bd; }
        body.dark-mode .progress-steps .step.active .step-number { background-color: #0d6efd; color: white; }
        body.dark-mode .progress-steps .step.completed .step-number { background-color: #198754; color: white; }
        body.dark-mode .alert-warning { background-color: #664d03; color: #fff3cd; border-color: #ffecb5; }
        body.dark-mode .alert-success { background-color: #0f5132; color: #d1e7dd; border-color: #badbcc; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
    {% block extra_js %}{% endblock %}

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const syncTheme = () => {
                let isDark = false;
                try {
                    if (localStorage.getItem('theme') === 'dark') isDark = true;
                    if (window.parent && window.parent.document.body.classList.contains('dark-mode')) isDark = true;
                } catch(e) {}
                
                if (isDark) {
                    document.documentElement.classList.add('dark-mode');
                    document.body.classList.add('dark-mode');
                } else {
                    document.documentElement.classList.remove('dark-mode');
                    document.body.classList.remove('dark-mode');
                }
            };
            
            // Initial sync
            syncTheme();
            
            // Listen to parent body class changes if possible
            try {
                if (window.parent && window.parent.document && window.parent.document.body) {
                    const observer = new MutationObserver((mutations) => {
                        mutations.forEach((mutation) => {
                            if (mutation.attributeName === 'class') {
                                syncTheme();
                            }
                        });
                    });
                    observer.observe(window.parent.document.body, { attributes: true });
                }
            } catch(e) {
                // Ignore cross-origin errors if any
            }
        });
    </script>

</body>
</html>
