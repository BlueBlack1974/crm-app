{% extends "base.html" %}

{% block title %}{{ _('Reset Password') }} - Crandyx CRM{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <img src="{{ url_for('static', filename='img/Logo.png') }}" alt="CRMtia Logo" class="img-fluid mb-3" style="max-width: 180px; height: auto;">
                    <h2 class="card-title">{{ _('Reset Password') }}</h2>
                    <p class="text-muted">{{ _('Enter your new password') }}</p>
                </div>
                
                <form method="POST">
                    <input type="hidden" name="token" value="{{ token }}">
                    
                    <div class="mb-3">
                        <label for="new_password" class="form-label">{{ _('New Password') }}</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control" id="new_password" name="new_password" required minlength="6">
                        </div>
                        <div class="form-text">{{ _('Password must be at least 6 characters long') }}</div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">{{ _('Confirm New Password') }}</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required minlength="6">
                        </div>
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-save me-2"></i>
                            {{ _('Reset Password') }}
                        </button>
                    </div>
                </form>
                
                <div class="text-center mt-4">
                    <a href="{{ url_for('login') }}" class="text-decoration-none">
                        <i class="fas fa-arrow-left me-1"></i>
                        {{ _('Back to Login') }}
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Şifre eşleşme kontrolü
document.getElementById('confirm_password').addEventListener('input', function() {
    const newPassword = document.getElementById('new_password').value;
    const confirmPassword = this.value;
    
    if (newPassword !== confirmPassword) {
        this.setCustomValidity('{{ _("Passwords do not match") }}');
    } else {
        this.setCustomValidity('');
    }
});

document.getElementById('new_password').addEventListener('input', function() {
    const confirmPassword = document.getElementById('confirm_password');
    if (confirmPassword.value) {
        confirmPassword.dispatchEvent(new Event('input'));
    }
});
</script>
{% endblock %}
