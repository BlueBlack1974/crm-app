{% extends "base.html" %}

{% block title %}Firma Ayarları - CRM{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Firma Ayarları</h1>
    <a href="{{ url_for('ayarlar') }}" class="btn btn-outline-secondary"><i class="fas fa-gear me-1"></i>Ayarlar</a>
    
</div>

<div class="row">
    <div class="col-lg-5">
        <div class="card shadow mb-4">
            <div class="card-header">Yeni Firma Ekle</div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Firma Adı *</label>
                        <input type="text" name="firma_adi" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Firma Kodu *</label>
                        <input type="text" name="firma_kodu" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Adres</label>
                        <input type="text" name="adres" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Telefon</label>
                        <input type="text" name="telefon" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">E-posta</label>
                        <input type="email" name="email" class="form-control">
                    </div>
                    <div class="text-end">
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>Kaydet</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div class="col-lg-7">
        <div class="card shadow mb-4">
            <div class="card-header">Firmalar</div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered">
                        <thead>
                            <tr>
                                <th>Adı</th>
                                <th>Kodu</th>
                                <th>E-posta</th>
                                <th>İşlemler</th>
                            </tr>
                        </thead>
                        <tbody>
                        {% for f in firmalar %}
                            <tr>
                                <td>{{ f.FirmaAdi }}</td>
                                <td>{{ f.FirmaKodu }}</td>
                                <td>{{ f.Email }}</td>
                                <td>
                                    <div class="btn-group" role="group">
                                        <button type="button" class="btn btn-sm btn-outline-primary" 
                                                onclick="editFirma({{ f.FirmaID }}, '{{ f.FirmaAdi }}', '{{ f.FirmaKodu }}', '{{ f.Adres or '' }}', '{{ f.Telefon or '' }}', '{{ f.Email or '' }}')">
                                            <i class="fas fa-edit"></i>
                                        </button>
                                        <form action="{{ url_for('ayarlar_firma_sil', firma_id=f.FirmaID) }}" method="POST" onsubmit="return confirm('Silmek istediğinize emin misiniz?')" style="display: inline;">
                                            <button class="btn btn-sm btn-danger"><i class="fas fa-trash"></i></button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Firma Düzenleme Modal -->
<div class="modal fade" id="editFirmaModal" tabindex="-1" aria-labelledby="editFirmaModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editFirmaModalLabel">Firma Düzenle</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="editFirmaForm" method="POST">
                <div class="modal-body">
                    <input type="hidden" id="edit_firma_id" name="firma_id">
                    <div class="mb-3">
                        <label for="edit_firma_adi" class="form-label">Firma Adı *</label>
                        <input type="text" id="edit_firma_adi" name="firma_adi" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="edit_firma_kodu" class="form-label">Firma Kodu *</label>
                        <input type="text" id="edit_firma_kodu" name="firma_kodu" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="edit_adres" class="form-label">Adres</label>
                        <input type="text" id="edit_adres" name="adres" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label for="edit_telefon" class="form-label">Telefon</label>
                        <input type="text" id="edit_telefon" name="telefon" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label for="edit_email" class="form-label">E-posta</label>
                        <input type="email" id="edit_email" name="email" class="form-control">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
                    <button type="submit" class="btn btn-primary">Güncelle</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function editFirma(id, adi, kodu, adres, telefon, email) {
    document.getElementById('edit_firma_id').value = id;
    document.getElementById('edit_firma_adi').value = adi;
    document.getElementById('edit_firma_kodu').value = kodu;
    document.getElementById('edit_adres').value = adres;
    document.getElementById('edit_telefon').value = telefon;
    document.getElementById('edit_email').value = email;
    
    // Form action'ını güncelle
    document.getElementById('editFirmaForm').action = "{{ url_for('ayarlar_firma_guncelle') }}";
    
    // Modal'ı göster
    var modal = new bootstrap.Modal(document.getElementById('editFirmaModal'));
    modal.show();
}
</script>
{% endblock %}
