<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Background -->
  <rect width="400" height="300" fill="#f8f9fa" rx="8"/>
  
  <!-- Calendar base -->
  <rect x="50" y="60" width="300" height="200" rx="12" fill="#ffffff" stroke="#e9ecef" stroke-width="2"/>
  
  <!-- Calendar header -->
  <rect x="50" y="60" width="300" height="50" rx="12" fill="#0d6efd"/>
  <text x="200" y="90" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" font-weight="bold" fill="#ffffff">Ekim 2024</text>
  
  <!-- Calendar grid lines -->
  <g stroke="#e9ecef" stroke-width="1">
    <!-- Vertical lines -->
    <line x1="92.86" y1="110" x2="92.86" y2="260"/>
    <line x1="135.71" y1="110" x2="135.71" y2="260"/>
    <line x1="178.57" y1="110" x2="178.57" y2="260"/>
    <line x1="221.43" y1="110" x2="221.43" y2="260"/>
    <line x1="264.29" y1="110" x2="264.29" y2="260"/>
    <line x1="307.14" y1="110" x2="307.14" y2="260"/>
    
    <!-- Horizontal lines -->
    <line x1="50" y1="130" x2="350" y2="130"/>
    <line x1="50" y1="150" x2="350" y2="150"/>
    <line x1="50" y1="170" x2="350" y2="170"/>
    <line x1="50" y1="190" x2="350" y2="190"/>
    <line x1="50" y1="210" x2="350" y2="210"/>
    <line x1="50" y1="230" x2="350" y2="230"/>
    <line x1="50" y1="250" x2="350" y2="250"/>
  </g>
  
  <!-- Day headers -->
  <g font-size="12" font-family="Arial, sans-serif" font-weight="bold" fill="#6c757d" text-anchor="middle">
    <text x="71.43" y="125">Pzt</text>
    <text x="114.29" y="125">Sal</text>
    <text x="157.14" y="125">Çar</text>
    <text x="200" y="125">Per</text>
    <text x="242.86" y="125">Cum</text>
    <text x="285.71" y="125">Cmt</text>
    <text x="328.57" y="125">Paz</text>
  </g>
  
  <!-- Calendar dates -->
  <g font-size="14" font-family="Arial, sans-serif" fill="#495057" text-anchor="middle">
    <!-- Week 1 -->
    <text x="71.43" y="145">30</text>
    <text x="114.29" y="145">1</text>
    <text x="157.14" y="145">2</text>
    <text x="200" y="145">3</text>
    <text x="242.86" y="145">4</text>
    <text x="285.71" y="145">5</text>
    <text x="328.57" y="145">6</text>
    
    <!-- Week 2 -->
    <text x="71.43" y="165">7</text>
    <text x="114.29" y="165">8</text>
    <text x="157.14" y="165">9</text>
    <text x="200" y="165">10</text>
    <text x="242.86" y="165">11</text>
    <text x="285.71" y="165">12</text>
    <text x="328.57" y="165">13</text>
    
    <!-- Week 3 -->
    <text x="71.43" y="185">14</text>
    <text x="114.29" y="185">15</text>
    <text x="157.14" y="185">16</text>
    <text x="200" y="185">17</text>
    <text x="242.86" y="185">18</text>
    <text x="285.71" y="185">19</text>
    <text x="328.57" y="185">20</text>
    
    <!-- Week 4 -->
    <text x="71.43" y="205">21</text>
    <text x="114.29" y="205">22</text>
    <text x="157.14" y="205">23</text>
    <text x="200" y="205">24</text>
    <text x="242.86" y="205">25</text>
    <text x="285.71" y="205">26</text>
    <text x="328.57" y="205">27</text>
    
    <!-- Week 5 -->
    <text x="71.43" y="225">28</text>
    <text x="114.29" y="225">29</text>
    <text x="157.14" y="225">30</text>
    <text x="200" y="225">31</text>
    <text x="242.86" y="225">1</text>
    <text x="285.71" y="225">2</text>
    <text x="328.57" y="225">3</text>
  </g>
  
  <!-- Highlighted appointment -->
  <circle cx="200" cy="185" r="12" fill="#28a745" opacity="0.2"/>
  <circle cx="200" cy="185" r="8" fill="#28a745"/>
  <text x="200" y="190" text-anchor="middle" font-size="10" font-family="Arial, sans-serif" font-weight="bold" fill="#ffffff">17</text>
  
  <!-- Appointment indicator -->
  <rect x="280" y="200" width="60" height="20" rx="10" fill="#28a745"/>
  <text x="310" y="213" text-anchor="middle" font-size="10" font-family="Arial, sans-serif" font-weight="bold" fill="#ffffff">Randevu</text>
</svg>