<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Dark blue background -->
  <rect width="32" height="32" fill="#1e3a8a" rx="4"/>
  
  <!-- Calendar icon -->
  <g transform="translate(4, 4)">
    <!-- Calendar binding loops -->
    <path d="M6 2 L6 1 M10 2 L10 1" stroke="white" stroke-width="0.8" fill="none"/>
    
    <!-- Calendar body -->
    <rect x="3" y="3" width="10" height="8" fill="none" stroke="white" stroke-width="0.8" rx="1"/>
    
    <!-- Calendar grid (3x3) -->
    <g stroke="white" stroke-width="0.3" fill="none">
      <!-- Vertical lines -->
      <line x1="5.5" y1="4" x2="5.5" y2="10"/>
      <line x1="8" y1="4" x2="8" y2="10"/>
      <line x1="10.5" y1="4" x2="10.5" y2="10"/>
      
      <!-- Horizontal lines -->
      <line x1="3.5" y1="5.5" x2="12.5" y2="5.5"/>
      <line x1="3.5" y1="7.5" x2="12.5" y2="7.5"/>
    </g>
    
    <!-- Checkmark in top-right square -->
    <circle cx="11" cy="4.5" r="1" fill="white"/>
    <path d="M10.3 4.5 L10.7 4.9 L11.7 3.9" stroke="#1e3a8a" stroke-width="0.4" fill="none"/>
  </g>
  
  <!-- Person icon -->
  <g transform="translate(18, 6)">
    <!-- Head -->
    <circle cx="6" cy="3" r="2" fill="white"/>
    <!-- Body -->
    <path d="M3 6 Q6 5 9 6 Q9 8 6 9 Q3 8 3 6 Z" fill="white"/>
  </g>
  
  <!-- CRM text -->
  <text x="16" y="26" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="white" text-anchor="middle">CRM</text>
</svg>
