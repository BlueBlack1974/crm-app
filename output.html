    <!-- Apply dark mode immediately before page render to prevent flashing -->
    <script>
        const excludedEndpoints = ['main.index', 'auth.login'];
        const currentEndpoint = 'auth.login';

        if (localStorage.getItem('theme') === 'dark' && !excludedEndpoints.includes(currentEndpoint)) {
            // Document body might not exist yet, so we use documentElement
            document.documentElement.classList.add('dark-mode');

            // Wait for body to be created to attach the class there since CSS targets body.dark-mode
            const observer = new MutationObserver(function (mutations) {
                if (document.body) {
                    document.body.classList.add('dark-mode');
                    observer.disconnect();
                }
            });
            observer.observe(document.documentElement, { childList: true });
        }
    </script>

    <!-- Dark Mode Toggle Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggleBtn = document.getElementById('themeToggle');
            const toggleIcon = themeToggleBtn ? themeToggleBtn.querySelector('i') : null;
            const currentEndpoint = 'auth.login';
            const excludedEndpoints = ['main.index', 'auth.login'];
            const isExcluded = excludedEndpoints.includes(currentEndpoint);

            // set correct icon based on current mode
            if (document.body.classList.contains('dark-mode') && toggleIcon && !isExcluded) {
                toggleIcon.classList.remove('fa-moon');
                toggleIcon.classList.add('fa-sun');
            }

            if (themeToggleBtn) {
                themeToggleBtn.addEventListener('click', (e) => {
                    e.preventDefault();

                    if (isExcluded) {
                        return; // Prevent toggling dark mode on excluded pages
                    }

                    document.body.classList.toggle('dark-mode');

                    if (document.body.classList.contains('dark-mode')) {
                        localStorage.setItem('theme', 'dark');
                        toggleIcon.classList.remove('fa-moon');
                        toggleIcon.classList.add('fa-sun');
                    } else {
                        localStorage.setItem('theme', 'light');
                        toggleIcon.classList.remove('fa-sun');
                        toggleIcon.classList.add('fa-moon');
                    }
                });
            }
        });
    </script>

    <script>
        // Basit bildirim polling'i
        async function fetchNotifications() {
            try {
                const res = await fetch('/api/bildirimler');
                if (!res.ok) return;
                const data = await res.json();
                const list = document.getElementById('notifList');
                const count = document.getElementById('notifCount');
                if (!list || !count) return;
                list.innerHTML = '';
                data.items.forEach(b => {
                    const li = document.createElement('li');
                    li.className = 'px-3 py-2 border-bottom d-flex justify-content-between align-items-start' + (b.okundu ? '' : ' bg-secondary bg-opacity-10');
                    li.dataset.id = b.id;

                    // Bildirim metnini çevir
                    let translatedMetin = b.metin;
                    const currentLang = document.documentElement.lang || 'tr';

                    if (currentLang === 'en') {
                        // Türkçe metinleri İngilizce'ye çevir
                        if (b.metin.includes('için randevu oluşturuldu')) {
                            translatedMetin = b.metin.replace('için randevu oluşturuldu', 'appointment created for');
                        } else if (b.metin.includes('taşındı')) {
                            translatedMetin = b.metin.replace('Randevu', 'Appointment moved from').replace('taşındı', '');
                        }
                    } else {
                        // İngilizce metinleri Türkçe'ye çevir (eğer varsa)
                        if (b.metin.includes('appointment created for')) {
                            translatedMetin = b.metin.replace('appointment created for', 'için randevu oluşturuldu');
                        } else if (b.metin.includes('Appointment moved from')) {
                            translatedMetin = b.metin.replace('Appointment moved from', 'Randevu').replace('->', '->') + ' taşındı';
                        }
                    }

                    li.innerHTML = `<div><div class="small text-muted">${b.tarih}</div><div>${translatedMetin}</div></div>` +
                        (b.okundu ? '' : '<button class="btn btn-sm btn-link p-0 ms-2">' + `Okundu İşaretle` + '</button>');
                    if (!b.okundu) {
                        li.querySelector('button').addEventListener('click', async (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            try {
                                await fetch('/api/bildirimler/okundu', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ids: [b.id] }) });
                                // Görsel olarak okundu işaretle ve sayacı azalt
                                li.classList.remove('bg-secondary', 'bg-opacity-10');
                                li.querySelector('button')?.remove();
                                const newUnread = Math.max(0, (data.unread || 0) - 1);
                                count.textContent = newUnread;
                                count.style.display = newUnread > 0 ? 'inline-block' : 'none';
                            } catch (err) { console.warn('Bildirim okundu işaretlenemedi'); }
                        });
                    }
                    list.appendChild(li);
                });
                count.textContent = data.unread;
                count.style.display = data.unread > 0 ? 'inline-block' : 'none';

                // Tümünü okundu işaretle
                const mark = document.getElementById('markAllRead');
                if (mark) {
                    mark.onclick = async (e) => {
                        e.preventDefault();
                        const ids = data.items.filter(x => !x.okundu).map(x => x.id);
                        if (ids.length === 0) return;
                        await fetch('/api/bildirimler/okundu', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ids }) });
                        fetchNotifications();
                    };
                }
            } catch (e) {
                console.warn('Bildirim alınamadı');
            }
        }
        if (isLoggedIn()) {
            // Dinamik aralık: görünürken hızlı, gizliyken yavaş
            let pollTimer = null;
            const ACTIVE_INTERVAL_MS = 15000;
            const HIDDEN_INTERVAL_MS = 60000;

            function clearPollTimer() {
                if (pollTimer) {
                    clearTimeout(pollTimer);
                    pollTimer = null;
                }
            }

            async function pollOnceAndSchedule() {
                try { await fetchNotifications(); } catch (e) { }
                clearPollTimer();
                const next = document.hidden ? HIDDEN_INTERVAL_MS : ACTIVE_INTERVAL_MS;
                pollTimer = setTimeout(pollOnceAndSchedule, next);
            }

            // İlk çağrı ve planlama
            pollOnceAndSchedule();

            // Sekme görünürlüğü/fokus değişince aralığı yeniden ayarla
            document.addEventListener('visibilitychange', () => {
                // görünür olduğunda hızlıca güncelle
                if (!document.hidden) { pollOnceAndSchedule(); }
            });
            window.addEventListener('focus', () => { pollOnceAndSchedule(); });
            window.addEventListener('blur', () => { pollOnceAndSchedule(); });

            // Çanağa gelince anlık yenile (kullanıcı etkileşimi)
            const bell = document.getElementById('notifBell');
            if (bell) {
                bell.addEventListener('mouseenter', () => { fetchNotifications(); });
                bell.addEventListener('click', () => { fetchNotifications(); });
            }

            // NOT: beforeunload event'inde clear-session çağrılmıyor
            // Çünkü sayfa navigasyonunda da tetiklenir ve oturumu yanlışlıkla temizler
            // Kullanıcı logout butonuna tıkladığında oturum temizlenir

            // Sayfa görünürlük değişikliği (tab değişimi, minimize vb.)
            document.addEventListener('visibilitychange', function () {
                if (document.hidden) {
                    // Sayfa gizlendiğinde son görülme zamanını güncelle
                    navigator.sendBeacon('/api/update-last-seen');
                }
            });

            // Global Message Notification Logic
            let lastUnreadMessageCount = 0;
            const messageSound = new Audio("/static/audio/notification.wav");

            async function checkUnreadMessages() {
                try {
                    const res = await fetch('/kullanici-mesaj/api/okunmamis-sayisi?t=' + new Date().getTime());
                    if (!res.ok) return;
                    const data = await res.json();
                    const count = data.okunmamis_sayisi;

                    // Update badges
                    const badge = document.getElementById('mesaj-badge');
                    const mobileBadge = document.getElementById('mesaj-badge-mobile');

                    if (badge) {
                        badge.textContent = count;
                        badge.style.display = count > 0 ? '' : 'none';
                    }
                    if (mobileBadge) {
                        mobileBadge.textContent = count;
                        mobileBadge.style.display = count > 0 ? '' : 'none';
                    }

                    // Play sound if count increased and we strictly have more than 0 messages
                    // We also check if lastUnreadMessageCount was initialized (not first load) to avoid sound on refresh
                    if (count > lastUnreadMessageCount && count > 0) {
                        // Check if we are NOT on the messages page or (we are on messages page but tab is hidden)
                        // Actually, if we are on messages page, the local logic might handle it too. 
                        // To avoid double sound, we can check path.
                        const isMessagePage = window.location.pathname.includes('/kullanici-mesaj/mesajlar');

                        if (!isMessagePage || document.hidden) {
                            try {
                                messageSound.currentTime = 0;
                                messageSound.play().catch(e => console.log("Audio autoplay blocked:", e));
                            } catch (e) { console.error(e); }
                        }
                    }

                    lastUnreadMessageCount = count;
                } catch (e) {
                    console.warn('Message check failed', e);
                }
            }

            // Initialize count without sound
            fetch('/kullanici-mesaj/api/okunmamis-sayisi?t=' + new Date().getTime())
                .then(r => r.json())
                .then(d => { lastUnreadMessageCount = d.okunmamis_sayisi; })
                .catch(e => { });

            // Poll every 10 seconds
            setInterval(checkUnreadMessages, 10000);
        }

        // Hatırlatmalar fonksiyonları
        async function loadReminders() {
            try {
                const response = await fetch('/api/today-reminders');

                // Oturum kontrolü - eğer login sayfasına yönlendirilmişse
                if (response.redirected && response.url.includes('/login')) {
                    return; // Sessizce çık
                }

                if (!response.ok) {
                    console.warn('Reminder fetch failed:', response.status);
                    return;
                }

                // Content-Type kontrolü - JSON değilse hata
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    console.warn('Beklenmeyen yanıt tipi:', contentType);
                    return;
                }

                const data = await response.json();

                const reminderList = document.getElementById('reminderList');
                const reminderCount = document.getElementById('reminderCount');
                const reminderButton = document.getElementById('reminderButton');

                if (data.success && data.reminders.length > 0) {
                    // Hatırlatmalar var
                    const currentLang = document.documentElement.lang || 'tr';
                    let reminderLabelText, completeText, readText;

                    if (currentLang === 'en') {
                        reminderLabelText = 'Reminder:';
                        completeText = 'Complete';
                        readText = 'Read';
                    } else if (currentLang === 'fr') {
                        reminderLabelText = 'Rappel:';
                        completeText = 'Terminer';
                        readText = 'Lu';
                    } else if (currentLang === 'de') {
                        reminderLabelText = 'Erinnerung:';
                        completeText = 'Abschließen';
                        readText = 'Gelesen';
                    } else {
                        reminderLabelText = 'Hatırlatma:';
                        completeText = 'Tamamla';
                        readText = 'Okundu';
                    }

                    reminderList.innerHTML = data.reminders.map(reminder => {
                        // Görev mi? Görevlere solid, genel hatırlatmalara dashed ve mavi ton
                        const isTask = !!reminder.gorev_mi;
                        const taskColor = reminder.durum_rengi || '#0dcaf0'; // info
                        const borderStyle = isTask ? `4px solid ${taskColor}` : `4px dashed #0dcaf0`;
                        const titleColor = isTask ? taskColor : '#0dcaf0';
                        const typeBadge = isTask ? '' : `<small class=\"badge bg-info text-dark ms-2\">Genel</small>`;

        async function checkReminderCount() {
            try {
                const response = await fetch('/api/today-reminders');

                // Oturum kontrolü - eğer login sayfasına yönlendirilmişse
                if (response.redirected && response.url.includes('/login')) {
                    return; // Sessizce çık
                }

                if (!response.ok) {
                    return; // Sessizce çık
                }

                // Content-Type kontrolü - JSON değilse hata
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    return; // Sessizce çık
                }

                const data = await response.json();

                const reminderCount = document.getElementById('reminderCount');
                const reminderButton = document.getElementById('reminderButton');

                if (data.success && data.reminders.length > 0) {
                    reminderCount.textContent = data.reminders.length;
                    reminderCount.style.display = 'inline-block';
                    reminderButton.classList.add('reminder-button');
                    reminderCount.classList.add('reminder-badge');
                } else {
                    reminderCount.style.display = 'none';
                    reminderButton.classList.remove('reminder-button');
                    reminderCount.classList.remove('reminder-badge');
                }
            } catch (error) {
                console.error('Hatırlatma sayısı kontrol edilirken hata:', error);
            }
        }

            console.log('Dil değişiyor:', lang);

            // Lang attribute'unu hemen set et
            document.documentElement.lang = lang;
            document.body.setAttribute('lang', lang);

            // languageChanged event'ini tetikle
            const event = new CustomEvent('languageChanged', { detail: { language: lang } });
            document.dispatchEvent(event);

            // Önce session'ı kontrol et
            fetch('/api/session/check', {
                method: 'GET',
                credentials: 'same-origin',
                headers: {

                }
            })
                .then(response => {
                    if (response.ok) {

                    } else {

        }

        // CSRF Token Helper - Tüm fetch isteklerine otomatik CSRF token ekle
        (function () {
            const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content');

            if (!csrfToken) {
                console.warn('[CSRF] CSRF token bulunamadi! Meta tag kontrol edin.');
                return;
            }

            // Fetch'i override et
            const originalFetch = window.fetch;
            window.fetch = function (...args) {
                const [url, options = {}] = args;

                // POST, PUT, PATCH, DELETE istekleri için CSRF token ekle
                if (options.method && ['POST', 'PUT', 'PATCH', 'DELETE'].includes(options.method.toUpperCase())) {
                    if (!options.headers) {
                        options.headers = {};
                    }

                    // Content-Type header'ı yoksa veya JSON ise
                    const isJson = options.headers['Content-Type']?.includes('application/json') ||
                        (!options.headers['Content-Type'] && options.body && typeof options.body === 'string' && options.body.trim().startsWith('{'));

                    // FormData ise veya Content-Type belirtilmemişse header'a ekle
                    const isFormData = options.body instanceof FormData;

                    // Her durumda header'a ekle (Flask-WTF hem header hem form field'dan okuyabilir)
                    if (!options.headers['X-CSRFToken']) {
                        options.headers['X-CSRFToken'] = csrfToken;
                    }

                    // FormData ise, FormData'ya da ekle (güvenlik için)
                    if (isFormData && options.body instanceof FormData) {
                        // FormData'da zaten varsa ekleme
                        if (!options.body.has('csrf_token')) {
                            options.body.append('csrf_token', csrfToken);
                        }
                    }
                }

                return originalFetch.apply(this, args);
            };

            // XMLHttpRequest'i de override et (eski kodlar için)
            const originalXHROpen = XMLHttpRequest.prototype.open;
            const originalXHRSend = XMLHttpRequest.prototype.send;

            XMLHttpRequest.prototype.open = function (method, url, ...rest) {
                this._method = method;
                this._url = url;
                return originalXHROpen.apply(this, [method, url, ...rest]);
            };

            XMLHttpRequest.prototype.send = function (data) {
                if (this._method && ['POST', 'PUT', 'PATCH', 'DELETE'].includes(this._method.toUpperCase())) {
                    if (!this.getRequestHeader('X-CSRFToken')) {
                        this.setRequestHeader('X-CSRFToken', csrfToken);
                    }
                    // FormData ise, FormData'ya da ekle
                    if (data instanceof FormData && !data.has('csrf_token')) {
                        data.append('csrf_token', csrfToken);
                    }
                }
                return originalXHRSend.apply(this, [data]);
            };
        })();
    </script>
